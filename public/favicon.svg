<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <!-- Top button -->
  <rect x="20" y="0" width="8" height="4" rx="2" fill="#6b7280"/>
  <!-- Button stem -->
  <rect x="22.5" y="3.5" width="3" height="2.5" fill="#6b7280"/>
  <!-- Clock body -->
  <circle cx="24" cy="26.5" r="19" stroke="#3b82f6" stroke-width="3" fill="none"/>
  <!-- Inner fill -->
  <circle cx="24" cy="26.5" r="17.5" fill="#0f2040" opacity="0.6"/>
  <!-- Minute hand -->
  <line x1="24" y1="26.5" x2="24" y2="12.5" stroke="#e5e7eb" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Hour hand -->
  <line x1="24" y1="26.5" x2="33" y2="21.5" stroke="#e5e7eb" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="24" cy="26.5" r="2.5" fill="#3b82f6"/>
  <!-- Hour markers -->
  <circle cx="24" cy="10.5" r="1.5" fill="#3b82f6"/>
  <circle cx="40" cy="26.5" r="1.5" fill="#3b82f6"/>
  <circle cx="24" cy="42.5" r="1.5" fill="#3b82f6"/>
  <circle cx="8" cy="26.5" r="1.5" fill="#3b82f6"/>
</svg>
